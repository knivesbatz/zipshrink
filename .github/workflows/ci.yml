name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FEATURES: zipshrink-core/failpoints,zipshrink-cli/failpoints

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
      - name: Dependency licenses
        run: python3 scripts/third_party.py && git diff --exit-code THIRD_PARTY_LICENSES.md

  # Code under cfg(target_os = "macos") is only type-checked on a Mac: the
  # crates that use ring cannot be checked for Apple targets elsewhere.
  lint-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple silicon. macos-15-intel is GitHub's Intel (x86_64)
        # Mac: the macos-13 image, the previous Intel one, was retired in
        # December 2025, and macos-15-intel is the last Intel image. When it
        # goes too, run the x86_64 tests on Apple silicon under Rosetta
        # (`cargo test --target x86_64-apple-darwin` on macos-14).
        os: [windows-latest, ubuntu-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: sha256sum for the round trip (macOS has shasum)
        if: runner.os == 'macOS'
        run: |
          if ! command -v sha256sum >/dev/null; then
            mkdir -p "$RUNNER_TEMP/shim"
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' >"$RUNNER_TEMP/shim/sha256sum"
            chmod +x "$RUNNER_TEMP/shim/sha256sum"
            echo "$RUNNER_TEMP/shim" >>"$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration, fault-injection and crash tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --features "$FEATURES" 2>&1 | tee test-output.txt
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          # Surface the failure lines as annotations, readable without the full log.
          grep -E "panicked at|^test .* FAILED|^error(\[|:)|left:|right:|assertion" test-output.txt | head -40 |
            while IFS= read -r line; do echo "::error title=test failure::$line"; done
          tail -5 test-output.txt | while IFS= read -r line; do echo "::error title=test tail::$line"; done
      - name: Release build of the command line tool
        run: cargo build --release --locked -p zipshrink-cli
      - name: Round trip with deletion, checked by a third-party tool
        shell: bash
        run: |
          set -euxo pipefail
          trap 'echo "::error title=round trip::line $LINENO failed: $BASH_COMMAND"' ERR
          Z=target/release/zipshrink
          mkdir -p rt/src/a/b rt/src/empty
          head -c 5000000 /dev/urandom > rt/src/a/random.bin
          head -c 3000000 < <(yes "some text") > rt/src/a/b/text.txt  # no pipe: `yes` would die of SIGPIPE under pipefail
          echo "unicode ü 日本" > "rt/src/a/ünï.txt"
          (cd rt && find src -type f -exec sha256sum {} + | sort -k2) > rt/before.sha
          $Z create rt/src -o rt/out.zip --delete-originals --yes --min-free 16M --part-size 4M
          test ! -e rt/src
          test ! -e rt/out.zip
          parts=(rt/out.part*.zip)
          test ${#parts[@]} -ge 2
          for p in "${parts[@]}"; do $Z verify "$p"; done
          mkdir rt/x
          # 7-Zip checks integrity where installed; Python's zipfile (UTF-8
          # aware on every platform) extracts.
          if command -v 7z >/dev/null; then for p in "${parts[@]}"; do 7z t "$p"; done; fi
          PY=$(command -v python3 || command -v python)
          "$PY" -c "import sys, zipfile; [zipfile.ZipFile(p).extractall(sys.argv[1]) for p in sys.argv[2:]]" rt/x "${parts[@]}"
          (cd rt/x && find src -type f -exec sha256sum {} + | sort -k2) | diff - rt/before.sha

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: Swatinem/rust-cache@v2
      - run: packaging/build-windows.sh
        env:
          ZIPSHRINK_UPDATE_REPO: ${{ github.repository }}
      - name: A command line tool that claims to be 0.0.1, for the updater test
        run: |
          cargo build --release --locked --target x86_64-pc-windows-gnu -p zipshrink-cli --target-dir target/old
          mkdir -p old && cp target/old/x86_64-pc-windows-gnu/release/zipshrink.exe old/
        env:
          ZIPSHRINK_UPDATE_FROM: 0.0.1
          ZIPSHRINK_UPDATE_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/
            old/

  macos-app:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build ZipShrink.app, ZipShrink.dmg and ZipShrink-mac.zip
        run: packaging/build-macos.sh
        env:
          ZIPSHRINK_UPDATE_REPO: ${{ github.repository }}
      - name: Universal, macOS 11, signed; round trip; launch and file hand-over; disk image and zip
        run: packaging/macos/check-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mac-app
          path: |
            dist/ZipShrink.dmg
            dist/ZipShrink-mac.zip
          if-no-files-found: error
      - name: An app that claims to be 0.0.1, for the updater test
        run: packaging/build-macos.sh 0.0.1
        env:
          ZIPSHRINK_UPDATE_FROM: 0.0.1
          ZIPSHRINK_UPDATE_REPO: ${{ github.repository }}
          ZIPSHRINK_MAC_TARGETS: aarch64-apple-darwin
          ZIPSHRINK_DIST: old
      - uses: actions/upload-artifact@v7
        with:
          name: mac-old
          path: old/ZipShrink-mac.zip
          if-no-files-found: error

  mac-install:
    needs: macos-app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/macos
      - uses: actions/download-artifact@v8
        with: { name: mac-old, path: old }
      - name: The updater downloads, checks and replaces the app with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/macos/check-update.sh old/ZipShrink-mac.zip "${{ github.repository }}"

  windows-install:
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: installer }
      # Old installers are kept as fixtures on the `ci-fixtures` prerelease,
      # which the release workflow does not delete (docs/BUILDING.md).
      - name: Setup installs, and replaces a copy installed from the 0.3 MSI (when the fixture is there)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "${env:ProgramFiles(x86)}\ZipShrink\zipshrink.exe"
          $haveMsi = $false
          foreach ($src in @('ci-fixtures', 'ZipShrink-0.3.0.msi'), @('v0.3.0', 'ZipShrink.msi')) {
            gh release download $src[0] --repo ${{ github.repository }} --pattern $src[1] --dir msi03
            if ($LASTEXITCODE -eq 0) { $haveMsi = $true; $msiFile = "msi03\$($src[1])"; break }
          }
          if ($haveMsi) {
            $p = Start-Process msiexec -ArgumentList '/i',$msiFile,'/qn' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "old msi failed: $($p.ExitCode)" }
            if (-not (Test-Path $msi)) { throw "old msi did not install" }
          } else {
            Write-Output "::warning::no ZipShrink 0.3 MSI (ci-fixtures release: ZipShrink-0.3.0.msi); removing an MSI copy is NOT tested"
          }
          $p = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if ($haveMsi -and (Test-Path $msi)) { throw "the MSI copy was not removed" }
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          if (-not (Test-Path "$dir\zipshrink-gui.exe")) { throw "gui missing" }
          & "$dir\zipshrink.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "zipshrink --version failed" }
          foreach ($k in 'HKCU:\Software\Classes\*\shell\ZipShrink\command', 'HKCU:\Software\Classes\Directory\shell\ZipShrink\command') {
            $cmd = (Get-Item -LiteralPath $k).GetValue('')
            if ($cmd -ne "`"$dir\zipshrink-gui.exe`" `"%1`"") { throw "right-click menu ${k}: '$cmd'" }
          }
          $v = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ZipShrink').DisplayVersion
          $want = (& "$dir\zipshrink.exe" --version).Split(' ')[-1]
          if ($v -ne $want) { throw "Add/Remove Programs shows $v, expected $want" }
      - name: A silent upgrade keeps the choices made before
        shell: pwsh
        run: |
          $desk = [Environment]::GetFolderPath('Desktop') + '\ZipShrink.lnk'
          if (-not (Test-Path $desk)) { throw "no desktop shortcut after the first install" }
          Remove-Item $desk
          $p = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade failed: $($p.ExitCode)" }
          if (Test-Path $desk) { throw "the upgrade put back the desktop shortcut" }
      - name: The updater's install waits for ZipShrink to close and starts it again
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          $gui = Start-Process "$dir\zipshrink-gui.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($gui.HasExited) { throw "ZipShrink did not stay open (exit code $($gui.ExitCode))" }
          $setup = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S','/RESTART' -PassThru
          Start-Sleep -Seconds 3
          if ($setup.HasExited) { throw "setup did not wait for ZipShrink to close" }
          Stop-Process -Id $gui.Id
          $setup.WaitForExit(90000) | Out-Null
          if ($setup.ExitCode -ne 0) { throw "setup failed: $($setup.ExitCode)" }
          Start-Sleep -Seconds 3
          $again = Get-Process zipshrink-gui -ErrorAction SilentlyContinue
          if (-not $again) { throw "ZipShrink was not started again" }
          $again | Stop-Process
      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          $p = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S',"_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          # The uninstaller parks itself in %TEMP% and a hidden cmd deletes
          # it (and, across drives, the folder) once it has exited.
          $parked = Join-Path ([IO.Path]::GetTempPath()) "ZipShrink-uninstall-$($p.Id).exe"
          for ($i = 0; $i -lt 30 -and ((Test-Path $dir) -or (Test-Path $parked)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "uninstall left the folder: $(Get-ChildItem $dir -Recurse -Name)" }
          if (Test-Path $parked) { throw "the uninstaller was left in $parked" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ZipShrink') { throw "uninstall left the Add/Remove Programs entry" }
          foreach ($k in 'HKCU:\Software\Classes\*\shell\ZipShrink', 'HKCU:\Software\Classes\Directory\shell\ZipShrink') {
            if (Test-Path -LiteralPath $k) { throw "uninstall left the right-click menu: $k" }
          }
          foreach ($l in ([Environment]::GetFolderPath('Programs') + '\ZipShrink.lnk'), ([Environment]::GetFolderPath('Desktop') + '\ZipShrink.lnk')) {
            if (Test-Path $l) { throw "uninstall left the shortcut $l" }
          }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -and ($path.Split(';') -contains $dir)) { throw "uninstall left $dir in PATH" }
      - name: Setup upgrades a copy installed by the 1.0 NSIS installer, as the 1.0 updater runs it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The 1.0 installer comes from the ci-fixtures release, or from the
          # v1.0.0 release while that still exists.
          $old = $null
          foreach ($src in @('ci-fixtures', 'ZipShrink-setup-1.0.0.exe'), @('v1.0.0', 'ZipShrink-setup.exe')) {
            gh release download $src[0] --repo ${{ github.repository }} --pattern $src[1] --dir nsis10
            if ($LASTEXITCODE -eq 0) { $old = "nsis10\$($src[1])"; break }
          }
          if (-not $old) {
            Write-Output "::warning::no ZipShrink 1.0.0 installer (ci-fixtures release: ZipShrink-setup-1.0.0.exe); the upgrade from the NSIS installer is NOT tested"
            exit 0
          }
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ZipShrink'
          $p = Start-Process $old -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the 1.0 installer failed: $($p.ExitCode)" }
          $v = (Get-ItemProperty $uninstKey).DisplayVersion
          if ($v -ne '1.0.0') { throw "the 1.0 installer recorded version '$v'" }
          # Leave one optional part out, which the upgrade must not put back.
          $desk = [Environment]::GetFolderPath('Desktop') + '\ZipShrink.lnk'
          $start = [Environment]::GetFolderPath('Programs') + '\ZipShrink.lnk'
          if (-not (Test-Path $desk) -or -not (Test-Path $start)) { throw "the 1.0 installer made no shortcuts" }
          Remove-Item $desk
          $setup = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S','/RESTART' -PassThru
          if (-not $setup.WaitForExit(120000)) { throw "the upgrade did not finish" }
          if ($setup.ExitCode -ne 0) { throw "the upgrade failed: $($setup.ExitCode)" }
          Start-Sleep -Seconds 3
          $gui = Get-Process zipshrink-gui -ErrorAction SilentlyContinue
          if (-not $gui) { throw "/RESTART did not start ZipShrink" }
          $gui | Stop-Process
          $want = (& "$dir\zipshrink.exe" --version).Split(' ')[-1]
          if ($want -eq '1.0.0') { throw "the program files were not replaced" }
          $v = (Get-ItemProperty $uninstKey).DisplayVersion
          if ($v -ne $want) { throw "Add/Remove Programs shows $v, expected $want" }
          $a = (Get-FileHash "$dir\Uninstall.exe").Hash
          $b = (Get-FileHash dist\ZipShrink-setup.exe).Hash
          if ($a -ne $b) { throw "Uninstall.exe is not the new program" }
          if (Test-Path $desk) { throw "the upgrade put back the desktop shortcut" }
          if (-not (Test-Path $start)) { throw "the upgrade lost the Start menu shortcut" }
          foreach ($k in 'HKCU:\Software\Classes\*\shell\ZipShrink\command', 'HKCU:\Software\Classes\Directory\shell\ZipShrink\command') {
            $cmd = (Get-Item -LiteralPath $k).GetValue('')
            if ($cmd -ne "`"$dir\zipshrink-gui.exe`" `"%1`"") { throw "right-click menu ${k}: '$cmd'" }
          }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (-not ($path.Split(';') -contains $dir)) { throw "the upgrade lost the PATH entry: $path" }
      - name: Uninstall the upgraded copy
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          $p = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S',"_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: $($p.ExitCode)" }
          # The uninstaller parks itself in %TEMP% and a hidden cmd deletes
          # it (and, across drives, the folder) once it has exited.
          $parked = Join-Path ([IO.Path]::GetTempPath()) "ZipShrink-uninstall-$($p.Id).exe"
          for ($i = 0; $i -lt 30 -and ((Test-Path $dir) -or (Test-Path $parked)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $dir) { throw "uninstall left the folder: $(Get-ChildItem $dir -Recurse -Name)" }
          if (Test-Path $parked) { throw "the uninstaller was left in $parked" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ZipShrink') { throw "uninstall left the Add/Remove Programs entry" }
          foreach ($k in 'HKCU:\Software\Classes\*\shell\ZipShrink', 'HKCU:\Software\Classes\Directory\shell\ZipShrink') {
            if (Test-Path -LiteralPath $k) { throw "uninstall left the right-click menu: $k" }
          }
          foreach ($l in ([Environment]::GetFolderPath('Programs') + '\ZipShrink.lnk'), ([Environment]::GetFolderPath('Desktop') + '\ZipShrink.lnk')) {
            if (Test-Path $l) { throw "uninstall left the shortcut $l" }
          }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -and ($path.Split(';') -contains $dir)) { throw "uninstall left $dir in PATH" }
      - name: The updater downloads, checks and installs the latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A copy that claims to be 0.0.1, so the published release is newer.
          $out = & old\zipshrink.exe update 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'limiting requests') { Write-Output "::warning::GitHub rate limit; updater test skipped"; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "zipshrink update failed" }
          if ($out -notmatch 'Verified the SHA-256') { throw "the download was not verified" }
          $tag = gh api repos/${{ github.repository }}/releases/latest --jq .tag_name
          $exe = "$env:LOCALAPPDATA\Programs\ZipShrink\zipshrink.exe"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          $v = & $exe --version
          Write-Output $v
          if ($v -notmatch [regex]::Escape($tag.TrimStart('v'))) { throw "installed '$v', expected $tag" }
