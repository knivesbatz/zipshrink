name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 nsis wixl
      - name: Programs, test programs and packages
        run: |
          make -j4 B=build all build/zipshrink-fp.exe build/zs-tests.exe
          packaging/build-windows.sh
        env:
          ZIPSHRINK_UPDATE_REPO: ${{ github.repository }}
      - name: Every import exists on Windows 95
        run: python3 scripts/check_imports.py build/zipshrink.exe build/zipshrink-gui.exe build/zipshrink-fp.exe build/zs-tests.exe
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            build/*.exe
            dist/

  test-wine:
    name: test (Wine, ${{ matrix.mode }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        mode: [win10, win95]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Install 32-bit Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine32:i386 wine
      - name: Prepare the Wine prefix
        run: |
          export WINEPREFIX=$HOME/pfx WINEDEBUG=-all
          wineboot -i
          wine reg add 'HKCU\Software\Wine' /v Version /d ${{ matrix.mode }} /f
          wineserver -w
          wine build/zipshrink.exe --version
      - name: Tests
        run: |
          export WINEPREFIX=$HOME/pfx LANG=C.UTF-8
          python3 tests/run.py --build build ${{ matrix.mode == 'win95' && '--win95' || '' }}

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Tests
        run: python tests/run.py --build build
      - name: Round trip checked by 7-Zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p rt/src/a/b rt/src/empty
          head -c 5000000 /dev/urandom > rt/src/a/random.bin
          head -c 3000000 < <(yes "some text") > rt/src/a/b/text.txt
          echo "unicode ü 日本" > "rt/src/a/ünï.txt"
          (cd rt && find src -type f -exec sha256sum {} + | sort -k2) > rt/before.sha
          build/zipshrink.exe create rt/src -o rt/out.zip --delete-originals --yes --min-free 16M --parts 2
          test ! -e rt/src
          7z t rt/out.part1.zip
          7z t rt/out.part2.zip
          mkdir rt/x
          7z x -ort/x rt/out.part1.zip
          7z x -ort/x rt/out.part2.zip
          (cd rt/x && find src -type f -exec sha256sum {} + | sort -k2) | diff - rt/before.sha

  windows-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Setup installs, runs and uninstalls silently
        shell: pwsh
        run: |
          $p = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup failed: $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          & "$dir\zipshrink.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "zipshrink --version failed" }
          if (-not (Test-Path "$dir\zipshrink-gui.exe")) { throw "gui missing" }
          $p = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S',"_?=$dir" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\zipshrink.exe") { throw "uninstall left files" }
      - name: MSI installs and uninstalls silently
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList '/i','dist\ZipShrink.msi','/qn','/l*v','msi.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; throw "msi failed: $($p.ExitCode)" }
          & "${env:ProgramFiles(x86)}\ZipShrink\zipshrink.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "zipshrink --version failed" }
          $p = Start-Process msiexec -ArgumentList '/x','dist\ZipShrink.msi','/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msi uninstall failed: $($p.ExitCode)" }
