name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 nsis
      - name: Programs, test programs and packages
        run: |
          make -j4 B=build all build/zipshrink-fp.exe build/zs-tests.exe
          make B=build-old EXTRA_CFLAGS='-DZS_UPDATE_FROM=\"0.0.1\"' build-old/zipshrink.exe
          packaging/build-windows.sh
      - name: Every import exists on Windows 95
        run: python3 scripts/check_imports.py build/zipshrink.exe build/zipshrink-gui.exe build/zipshrink-fp.exe build/zs-tests.exe
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            build/*.exe
            build-old/zipshrink.exe
            dist/

  test-wine:
    name: test (Wine, ${{ matrix.mode }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        mode: [win10, win95]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Install 32-bit Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine32:i386 wine
      - name: Prepare the Wine prefix
        run: |
          export WINEPREFIX=$HOME/pfx WINEDEBUG=-all
          wineboot -i
          wine reg add 'HKCU\Software\Wine' /v Version /d ${{ matrix.mode }} /f
          wineserver -w
          wine build/zipshrink.exe --version
      - name: Tests
        run: |
          export WINEPREFIX=$HOME/pfx LANG=C.UTF-8
          python3 tests/run.py --build build ${{ matrix.mode == 'win95' && '--win95' || '' }}

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Tests
        run: python tests/run.py --build build
      - name: Round trip checked by 7-Zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p rt/src/a/b rt/src/empty
          head -c 5000000 /dev/urandom > rt/src/a/random.bin
          head -c 3000000 < <(yes "some text") > rt/src/a/b/text.txt
          echo "unicode ü 日本" > "rt/src/a/ünï.txt"
          (cd rt && find src -type f -exec sha256sum {} + | sort -k2) > rt/before.sha
          build/zipshrink.exe create rt/src -o rt/out.zip --delete-originals --yes --min-free 16M --parts 2
          test ! -e rt/src
          7z t rt/out.part1.zip
          7z t rt/out.part2.zip
          mkdir rt/x
          7z x -ort/x rt/out.part1.zip
          7z x -ort/x rt/out.part2.zip
          (cd rt/x && find src -type f -exec sha256sum {} + | sort -k2) | diff - rt/before.sha

  windows-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: build }
      - name: Setup replaces a copy installed from the 0.3 MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.3.0 --repo ${{ github.repository }} --pattern ZipShrink.msi --dir old
          $p = Start-Process msiexec -ArgumentList '/i','old\ZipShrink.msi','/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "old msi failed: $($p.ExitCode)" }
          $msi = "${env:ProgramFiles(x86)}\ZipShrink\zipshrink.exe"
          if (-not (Test-Path $msi)) { throw "old msi did not install" }
          $p = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $msi) { throw "the MSI copy was not removed" }
          & "$env:LOCALAPPDATA\Programs\ZipShrink\zipshrink.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "zipshrink --version failed" }
      - name: A silent upgrade keeps the choices made before
        shell: pwsh
        run: |
          $desk = [Environment]::GetFolderPath('Desktop') + '\ZipShrink.lnk'
          if (-not (Test-Path $desk)) { throw "no desktop shortcut after the first install" }
          Remove-Item $desk
          $p = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade failed: $($p.ExitCode)" }
          if (Test-Path $desk) { throw "the upgrade put back the desktop shortcut" }
      - name: The updater's install waits for ZipShrink to close and starts it again
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          $gui = Start-Process "$dir\zipshrink-gui.exe" -PassThru
          Start-Sleep -Seconds 3
          $setup = Start-Process dist\ZipShrink-setup.exe -ArgumentList '/S','/RESTART' -PassThru
          Start-Sleep -Seconds 3
          if ($setup.HasExited) { throw "setup did not wait for ZipShrink to close" }
          Stop-Process -Id $gui.Id
          $setup.WaitForExit(60000) | Out-Null
          if ($setup.ExitCode -ne 0) { throw "setup failed: $($setup.ExitCode)" }
          Start-Sleep -Seconds 3
          $again = Get-Process zipshrink-gui -ErrorAction SilentlyContinue
          if (-not $again) { throw "ZipShrink was not started again" }
          $again | Stop-Process
      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\ZipShrink"
          $p = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S',"_?=$dir" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\zipshrink.exe") { throw "uninstall left files" }
      - name: The updater downloads, checks and installs the latest release
        shell: pwsh
        run: |
          # A copy that claims to be 0.0.1, so the published release is newer.
          $out = & build-old\zipshrink.exe update 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'limiting requests') { Write-Output "::warning::GitHub rate limit; updater test skipped"; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw "zipshrink update failed" }
          if ($out -notmatch 'Verified the SHA-256') { throw "the download was not verified" }
          $tag = (Invoke-RestMethod https://api.github.com/repos/${{ github.repository }}/releases/latest).tag_name
          $exe = "$env:LOCALAPPDATA\Programs\ZipShrink\zipshrink.exe"
          for ($i = 0; $i -lt 60 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 5
          $v = & $exe --version
          Write-Output $v
          if ($v -notmatch [regex]::Escape($tag.TrimStart('v'))) { throw "installed '$v', expected $tag" }
