name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 nsis wixl
      - name: Build packages
        run: packaging/build-windows.sh
        env:
          ZIPSHRINK_UPDATE_REPO: ${{ github.repository }}
      - name: The tag matches the program's version
        run: |
          tag="${{ inputs.tag }}"; tag="${tag:-$GITHUB_REF_NAME}"
          v=$(sed -n 's/^#define ZS_VERSION "\(.*\)"/\1/p' src/version.h)
          test "$tag" = "v$v" || { echo "::error::tag $tag does not match version $v in src/version.h"; exit 1; }
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          tag="${{ inputs.tag }}"; tag="${tag:-$GITHUB_REF_NAME}"
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release made in the web UI, or a draft left by a failed run:
            # attach the files to it and publish it.
            gh release upload "$tag" * --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA" --title "ZipShrink ${tag#v}"
            fi
          else
            # Creates the tag at the built commit when run by hand.
            gh release create "$tag" * --repo "$GITHUB_REPOSITORY" --title "ZipShrink ${tag#v}" --generate-notes --target "$GITHUB_SHA"
          fi
