[workspace]
resolver = "2"
members = ["crates/zipshrink-core", "crates/zipshrink-cli", "crates/zipshrink-gui", "crates/zipshrink-update"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/knivesbatz/zipshrink"
authors = ["ZipShrink contributors"]

[workspace.dependencies]
zipshrink-core = { path = "crates/zipshrink-core", version = "0.1.0" }
zipshrink-update = { path = "crates/zipshrink-update", version = "0.1.0" }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.20"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Compression in unoptimised builds makes the test suite crawl.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2
