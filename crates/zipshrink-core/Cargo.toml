[package]
name = "zipshrink-core"
description = "Space-saving ZIP creation engine: verified, crash-safe, resumable, optionally deleting originals as it goes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Named crash/fault points used by the fault-injection test suite.
# Never enabled in release builds.
failpoints = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
thiserror = "2"
fs4 = "1.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
# Independent ZIP reader used to cross-check every archive we write.
zip = { version = "9", default-features = false, features = ["deflate"] }
dunce = "1.0"
crossbeam-channel = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile.workspace = true
