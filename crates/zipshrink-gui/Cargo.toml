[package]
name = "zipshrink-gui"
description = "ZipShrink desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zipshrink-gui"
path = "src/main.rs"

[dependencies]
zipshrink-core.workspace = true
zipshrink-update.workspace = true
eframe = { version = "0.37", features = ["glow"] }
rfd = "0.17"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
