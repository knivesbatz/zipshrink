[package]
name = "zipshrink-cli"
description = "ZipShrink command line: create ZIP archives that reclaim space as they go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "zipshrink"
path = "src/main.rs"

[features]
failpoints = ["zipshrink-core/failpoints"]

[dependencies]
zipshrink-core.workspace = true
zipshrink-update.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive", "wrap_help"] }
indicatif = "0.18"
console = "0.16"
ctrlc = { version = "3.4", features = ["termination"] }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json.workspace = true
